[package]
name = "trading_brokers"
version = "0.1.0"
edition = "2024"

[lib]
name = "trading_brokers"
path = "src/lib.rs"

[dependencies]
trading_signals_text_tokens = { path = "../trading_signals_text_tokens" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "process"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
reqwest = { version = "0.11", features = ["blocking", "json"] }
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
